<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Examples</title>
</head>
<body>
    <mood-stone></mood-stone>
    <div id=target></div>
    <!-- #include virtual="/imports.html" -->
    <script type=module>
        import '/MoodStone/MoodStone.js';
        import '/🕹️.js';
    </script>
    <script>
        function runTest(){
            const ms = document.querySelector('mood-stone');
            ms.shadowRoot.querySelector('input').dispatchEvent(new Event('input'));
            
            setTimeout(() => {
                if(ms.invokeCount === 1){
                    target.setAttribute('mark', 'good');
                }
            }, 100);
            
        }
        setTimeout(() => {
            runTest();
        }, 500);
    </script>
</body>
</html>
