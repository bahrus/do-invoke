<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example 1c</title>
    <!-- #include virtual="/imports.html" -->
    <script type=module>
        import {Mount} from 'xtal-element/index.js';
        import '/🕹️.js';
        class SoulSearchingBase extends Mount{
            engage(targetElement, event){
                console.log({targetElement, event});
            }
        }
        customElements.define('soul-searching-base', SoulSearchingBase);
    </script>
</head>
<body>
    <mood-stone>
        <soul-searching #>
            <xtal-element
                inherits=soul-searching-base
            ></xtal-element>
        </soul-searching>
        <button defer-🕹️ 🕹️=#{{soul-searching}}?.engage>What have I done?</button>
        <xtal-element -id></xtal-element>
    </mood-stone>
</body>
</html>
